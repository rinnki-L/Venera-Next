name: Format Issue 176

on:
  push:
    branches:
      - ci/format-176

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        shell: bash
        run: |
          mapfile -t dart_files < <(git diff --diff-filter=ACMRTUXB --name-only c0c45979d453c2a8740c45f08e95997c90717629...HEAD -- '*.dart')
          printf '%s\n' "${dart_files[@]}"
          dart format "${dart_files[@]}"
          mkdir -p build/formatted
          for file in "${dart_files[@]}"; do
            mkdir -p "build/formatted/$(dirname "$file")"
            cp "$file" "build/formatted/$file"
          done
          git diff --stat
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-dart
          path: build/formatted
          if-no-files-found: error
          retention-days: 1